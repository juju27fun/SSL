name: CPU checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Models is fetched at the immutable Git revision in pyproject.toml/uv.lock.
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Check wheel provenance and README metadata
        run: |
          uv run python - <<'PYCODE'
          import glob, zipfile
          with zipfile.ZipFile(glob.glob('dist/*.whl')[0]) as archive:
              assert any(name.endswith('/PROVENANCE.json') for name in archive.namelist())
              metadata = next(name for name in archive.namelist() if name.endswith('/METADATA'))
              assert b'Description-Content-Type: text/markdown' in archive.read(metadata)
          PYCODE

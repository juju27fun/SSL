name: CPU checks
on:
  workflow_dispatch:
    inputs:
      models_repository:
        description: GitHub owner/repository providing Models
        required: true
        type: string
      models_ref:
        description: Models commit or tag to verify against
        required: true
        type: string
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: SSL
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.models_repository }}
          ref: ${{ inputs.models_ref }}
          path: Models
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
        working-directory: SSL
      - run: uv run pytest -q
        working-directory: SSL
      - run: uv build
        working-directory: SSL

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smi-ssl"
version = "0.1.0"
readme = "README.md"
description = "Portable MAD4d U-Net masked reconstruction and latent evaluation"
requires-python = ">=3.12"
dependencies = ["smi-research-models==0.1.0", "numpy>=1.26,<3", "scipy>=1.14,<1.17", "scikit-learn>=1.5,<2", "torch>=2.6,<3", "matplotlib>=3.8,<4"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
smi-ssl = "smi_ssl.cli:main"

[tool.uv.sources]
smi-research-models = {git = "https://github.com/juju27fun/Models.git", rev = "ee82c1647046c4ebdf3faef98079d6dc53737b9d"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smi_ssl = ["presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.data-files]
"share/smi_ssl" = ["PROVENANCE.json", "README.md"]
